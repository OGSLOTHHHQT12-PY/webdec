<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>LIT DRIP | Wear The Future</title>
  <meta name="description" content="Premium streetwear for the next generation. Gaming-inspired apparel, limited drops, and futuristic fashion.">
  <!-- Google Fonts: Space Grotesk + Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    :root {
      --bg-dark: #0a0a0c;
      --bg-card: #111115;
      --bg-elevated: #18181e;
      --border-glow: rgba(255, 94, 0, 0.25);
      --accent-primary: #ff5e00;
      --accent-secondary: #ff2b8e;
      --text-primary: #f0f0f0;
      --text-secondary: #a0a0a8;
      --transition-smooth: all 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-primary);
      overflow-x: hidden;
    }

    h1, h2, h3, h4, .logo, .hero-title, .price, .btn, .nav-link, .card-title {
      font-family: 'Space Grotesk', sans-serif;
    }

    /* Premium Glassmorphism */
    .glass-card {
      background: rgba(24, 24, 30, 0.7);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 94, 0, 0.15);
      border-radius: 28px;
    }

    .glass-nav {
      background: rgba(10, 10, 12, 0.85);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255, 94, 0, 0.2);
    }

    /* Custom Scroll */
    ::-webkit-scrollbar {
      width: 5px;
    }
    ::-webkit-scrollbar-track {
      background: #141416;
    }
    ::-webkit-scrollbar-thumb {
      background: var(--accent-primary);
      border-radius: 10px;
    }

    /* Animations */
    @keyframes fadeUp {
      0% { opacity: 0; transform: translateY(35px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes glowPulse {
      0% { box-shadow: 0 0 0 0 rgba(255, 94, 0, 0.4); }
      70% { box-shadow: 0 0 0 10px rgba(255, 94, 0, 0); }
      100% { box-shadow: 0 0 0 0 rgba(255, 94, 0, 0); }
    }
    .reveal {
      animation: fadeUp 0.7s ease forwards;
    }
    .product-card {
      transition: var(--transition-smooth);
      cursor: pointer;
    }
    .product-card:hover {
      transform: translateY(-8px);
      border-color: var(--accent-primary);
      box-shadow: 0 20px 35px -12px rgba(255, 94, 0, 0.25);
    }
    .btn-primary {
      background: linear-gradient(105deg, var(--accent-primary), var(--accent-secondary));
      border: none;
      color: white;
      font-weight: 600;
      transition: var(--transition-smooth);
      cursor: pointer;
    }
    .btn-primary:hover {
      transform: scale(1.02);
      box-shadow: 0 0 18px rgba(255, 94, 0, 0.5);
    }
    .btn-outline {
      background: transparent;
      border: 1.5px solid rgba(255, 255, 255, 0.3);
      color: white;
      transition: var(--transition-smooth);
      cursor: pointer;
    }
    .btn-outline:hover {
      border-color: var(--accent-primary);
      background: rgba(255, 94, 0, 0.1);
    }
    .badge-hot {
      background: linear-gradient(135deg, #ff2b8e, #ff5e00);
      font-size: 0.7rem;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 30px;
      letter-spacing: 0.5px;
    }
    .badge-soldout {
      background: #2a2a30;
      color: #aaa;
    }
    .countdown-box {
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(12px);
      border-radius: 60px;
      border: 1px solid rgba(255, 94, 0, 0.3);
    }
    /* Cart Drawer */
    .cart-drawer {
      position: fixed;
      top: 0;
      right: -500px;
      width: 500px;
      height: 100vh;
      background: #0c0c10;
      z-index: 1000;
      box-shadow: -8px 0 30px rgba(0, 0, 0, 0.6);
      transition: right 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.1);
      padding: 1.8rem;
      display: flex;
      flex-direction: column;
      border-left: 2px solid var(--accent-primary);
    }
    .cart-drawer.open {
      right: 0;
    }
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(6px);
      z-index: 999;
      display: none;
    }
    .overlay.active {
      display: block;
    }
    /* Product Grid */
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 2rem;
    }
    /* Admin Panel Premium */
    .admin-panel {
      background: #0f0f14;
      border-radius: 32px;
      border: 1px solid #2a2a30;
    }
    /* Responsive */
    @media (max-width: 768px) {
      .cart-drawer { width: 100%; right: -100%; }
      .hero-title { font-size: 3rem !important; }
      .product-grid { gap: 1.2rem; }
    }
    .marquee {
      background: #030303;
      padding: 1rem 0;
      border-top: 1px solid rgba(255, 94, 0, 0.2);
      border-bottom: 1px solid rgba(255, 94, 0, 0.2);
    }
    .toast-message {
      position: fixed;
      bottom: 25px;
      left: 25px;
      background: #1d1d24;
      border-left: 5px solid var(--accent-primary);
      padding: 12px 24px;
      border-radius: 40px;
      z-index: 1200;
      font-weight: 500;
      backdrop-filter: blur(12px);
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }
    input, select, textarea {
      font-family: 'Inter', sans-serif;
    }
    .wishlist-active {
      color: #ff2b8e;
    }
  </style>
</head>
<body>

<!-- Cart Drawer -->
<div class="overlay" id="cartOverlay"></div>
<div class="cart-drawer" id="cartDrawer">
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
    <h3 style="font-family: 'Space Grotesk'; font-size: 1.6rem;">YOUR BAG</h3>
    <i class="fas fa-times" id="closeCartBtn" style="cursor: pointer; font-size: 1.5rem; opacity: 0.7;"></i>
  </div>
  <div id="cartItemsList" style="flex: 1; overflow-y: auto; padding-right: 5px;"></div>
  <div style="border-top: 1px solid #222; padding-top: 1.5rem; margin-top: 1rem;">
    <div style="display: flex; justify-content: space-between; margin-bottom: 0.8rem;">
      <span>Subtotal</span>
      <span id="cartSubtotal" style="font-weight: 700; font-size: 1.3rem;">$0</span>
    </div>
    <p style="font-size: 0.8rem; color: #888; margin-bottom: 1rem;">Taxes & shipping calculated at checkout</p>
    <button id="checkoutBtnSimulate" class="btn-primary" style="width: 100%; padding: 1rem; border-radius: 50px; font-weight: 700;">PROCEED TO CHECKOUT →</button>
  </div>
</div>

<!-- Sticky Navbar Premium -->
<nav class="glass-nav" style="position: sticky; top: 0; z-index: 100; padding: 1rem 6%;">
  <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap;">
    <div class="logo" style="font-size: 1.9rem; font-weight: 700; letter-spacing: -1.5px;">LIT<span style="color: #ff5e00;">DRIP</span></div>
    <div style="display: flex; gap: 2rem; align-items: center;">
      <a href="#" data-nav="home" class="nav-link" style="text-decoration: none; color: white; font-weight: 500;">Home</a>
      <a href="#" data-nav="shop" class="nav-link" style="text-decoration: none; color: white; font-weight: 500;">Shop</a>
      <a href="#" data-nav="about" class="nav-link" style="text-decoration: none; color: white; font-weight: 500;">Movement</a>
      <a href="#" data-nav="contact" class="nav-link" style="text-decoration: none; color: white; font-weight: 500;">Connect</a>
      <i class="fas fa-search" id="searchIconNav" style="cursor: pointer; font-size: 1.1rem;"></i>
      <i class="far fa-heart" id="wishlistIconNav" style="cursor: pointer; font-size: 1.1rem;"></i>
      <i class="fas fa-shopping-bag" id="cartIconNav" style="cursor: pointer; font-size: 1.2rem; position: relative;"></i>
      <i class="fas fa-user-cog" id="adminIcon" style="cursor: pointer; font-size: 1.1rem; opacity: 0.8;"></i>
    </div>
  </div>
</nav>

<main id="appContent" style="min-height: 80vh;"></main>

<script>
  // ---------- PREMIUM PRODUCT DATA ----------
  let products = [
    { id: 1, name: "CYBERDRIP HOODIE", price: 89, category: "hoodie", sizes: ["S","M","L","XL"], colors: ["Black","Neon Orange"], stock: 12, image: "https://images.unsplash.com/photo-1556821840-3a63f95609a7?w=600&auto=format", badge: "Hot Drop", isNew: true, rating: 4.8 },
    { id: 2, name: "NEON RAGE TEE", price: 49, category: "tee", sizes: ["S","M","L"], colors: ["Black","White"], stock: 24, image: "https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=600&auto=format", badge: "New Arrival", isNew: true, rating: 4.5 },
    { id: 3, name: "FUTURE CARGO PANTS", price: 119, category: "pants", sizes: ["28","30","32","34"], colors: ["Charcoal"], stock: 8, image: "https://images.unsplash.com/photo-1594938298603-c8148c4dae35?w=600&auto=format", badge: "Almost Sold Out", rating: 4.9 },
    { id: 4, name: "LIT DRIP SNEAKERS", price: 159, category: "shoes", sizes: ["7","8","9","10","11"], colors: ["Black/Neon"], stock: 5, image: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=600&auto=format", badge: "Limited Drop", rating: 4.7 },
    { id: 5, name: "GAMING JERSEY", price: 79, category: "tee", sizes: ["S","M","L","XL"], colors: ["Purple","Black"], stock: 14, image: "https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?w=600&auto=format", badge: "Hot Drop", rating: 4.6 },
    { id: 6, name: "TECH WEAR CAP", price: 39, category: "accessory", sizes: ["One Size"], colors: ["Black"], stock: 30, image: "https://images.unsplash.com/photo-1588850561407-ed78c282e89b?w=600&auto=format", badge: "Essentials", rating: 4.3 }
  ];

  let cart = [];
  let wishlist = [];
  let currentPage = "home";
  let adminLoggedIn = false;
  const adminWhitelist = ["admin@litdrip.com", "studio@litdrip.com"];

  // Helpers
  function saveCart() { localStorage.setItem("litdrip_cart", JSON.stringify(cart)); updateCartBadge(); renderCartDrawer(); }
  function loadCart() { const c = localStorage.getItem("litdrip_cart"); if(c) cart = JSON.parse(c); updateCartBadge(); renderCartDrawer(); }
  function updateCartBadge() {
    const count = cart.reduce((a,b)=>a+b.qty,0);
    const icon = document.getElementById("cartIconNav");
    const existing = document.querySelector(".cart-count-badge");
    if(existing) existing.remove();
    if(count > 0 && icon) {
      const badge = document.createElement("span");
      badge.className = "cart-count-badge";
      badge.innerText = count;
      badge.style.cssText = "position:absolute; background:#ff5e00; border-radius:30px; padding:2px 7px; font-size:10px; font-weight:bold; top:-8px; right:-12px;";
      icon.style.position = "relative";
      icon.appendChild(badge);
    }
  }
  function renderCartDrawer() {
    const container = document.getElementById("cartItemsList");
    if(!container) return;
    if(cart.length === 0) { container.innerHTML = "<div style='text-align:center; margin-top: 3rem; opacity:0.6;'>Your bag is empty.<br>Add some fire 🔥</div>"; document.getElementById("cartSubtotal").innerText = "$0"; return; }
    let html = ""; let total = 0;
    cart.forEach((item, idx) => {
      const prod = products.find(p => p.id === item.id);
      if(!prod) return;
      total += prod.price * item.qty;
      html += `<div style="display: flex; gap: 1rem; margin-bottom: 1.5rem; border-bottom: 1px solid #222; padding-bottom: 1rem;">
        <img src="${prod.image}" style="width: 80px; height: 80px; object-fit: cover; border-radius: 20px;">
        <div style="flex:1"><strong style="font-size: 1rem;">${prod.name}</strong>
        <div style="color: #ff5e00; font-weight:600;">$${prod.price}</div>
        <div style="display: flex; gap: 12px; margin-top: 8px; align-items:center;">
          <button class="cart-qty-btn" data-idx="${idx}" data-delta="-1" style="background:#222; border:none; width:26px; border-radius:30px; cursor:pointer;">−</button>
          <span>${item.qty}</span>
          <button class="cart-qty-btn" data-idx="${idx}" data-delta="1" style="background:#222; border:none; width:26px; border-radius:30px; cursor:pointer;">+</button>
          <button class="cart-remove" data-idx="${idx}" style="background:none; border:none; color:#ff5e00; margin-left: auto; cursor:pointer;">Remove</button>
        </div></div></div>`;
    });
    container.innerHTML = html;
    document.getElementById("cartSubtotal").innerText = `$${total}`;
    document.querySelectorAll(".cart-qty-btn").forEach(btn => {
      btn.addEventListener("click", (e) => {
        const idx = parseInt(btn.dataset.idx);
        const delta = parseInt(btn.dataset.delta);
        if(cart[idx]) { cart[idx].qty += delta; if(cart[idx].qty <= 0) cart.splice(idx,1); saveCart(); renderCurrentPage(); renderCartDrawer(); }
      });
    });
    document.querySelectorAll(".cart-remove").forEach(btn => {
      btn.addEventListener("click", (e) => {
        const idx = parseInt(btn.dataset.idx);
        cart.splice(idx,1); saveCart(); renderCurrentPage(); renderCartDrawer();
      });
    });
  }
  function addToCart(id, qty = 1) {
    const existing = cart.find(i => i.id === id);
    if(existing) existing.qty += qty;
    else cart.push({ id, qty, size: "M" });
    saveCart();
    showToast("Added to bag • LIT AF");
    renderCurrentPage();
  }
  function showToast(msg) {
    const toast = document.createElement("div");
    toast.className = "toast-message";
    toast.innerText = msg;
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 2500);
  }
  // Admin Dashboard
  function showAdminPanel() {
    if(!adminLoggedIn) {
      const email = prompt("Admin access • Google Login simulation\nEnter whitelisted email:", "admin@litdrip.com");
      if(email && adminWhitelist.includes(email.toLowerCase())) { adminLoggedIn = true; showToast("Admin access granted"); renderAdminDashboard(); }
      else { alert("Access denied • Not on whitelist"); return; }
    } else { renderAdminDashboard(); }
  }
  function renderAdminDashboard() {
    const modalDiv = document.createElement("div");
    modalDiv.style.cssText = "position:fixed; top:8%; left:10%; width:80%; height:84%; background:#0c0c10; z-index:2000; border-radius:32px; padding:2rem; overflow:auto; border:1px solid #ff5e00; box-shadow:0 25px 40px rgba(0,0,0,0.6);";
    modalDiv.innerHTML = `
      <div style="display:flex; justify-content:space-between; margin-bottom:2rem;"><h2 style="font-family:Space Grotesk;">⚡ ADMIN • LIT DRIP CONTROL</h2><button id="closeAdminBtn" style="background:transparent; border:none; color:white; font-size:1.5rem;">✕</button></div>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:2rem;">
        <div><h3>📦 Product Inventory</h3><div id="adminProductList"></div><button id="addProductBtnAdmin" class="btn-outline" style="margin-top:1rem; padding:0.7rem 1.5rem;">+ Add New Product</button></div>
        <div><h3>📝 Recent Orders (Demo)</h3><div id="adminOrdersList"></div><h3 style="margin-top:2rem;">🎨 Homepage Hero</h3><input id="heroInputAdmin" placeholder="Hero Line" value="Wear The Future." style="width:100%; padding:0.8rem; background:#222; border:none; border-radius:20px;"><button id="updateHeroBtnAdmin" style="margin-top:0.8rem;">Update Hero Text</button></div>
      </div>
    `;
    document.body.appendChild(modalDiv);
    document.getElementById("closeAdminBtn").onclick = () => modalDiv.remove();
    function renderProdList() {
      const container = document.getElementById("adminProductList");
      if(!container) return;
      container.innerHTML = products.map(p => `
        <div style="background:#18181e; margin-bottom:0.8rem; padding:0.8rem; border-radius:20px; display:flex; justify-content:space-between; align-items:center;">
          <div><strong>${p.name}</strong> • $${p.price} • stock:${p.stock}</div>
          <div><button class="editProdBtnAdmin" data-id="${p.id}" style="margin-right:8px;">✏️</button><button class="deleteProdBtnAdmin" data-id="${p.id}">🗑️</button></div>
        </div>`).join("");
      document.querySelectorAll(".editProdBtnAdmin").forEach(btn => {
        btn.addEventListener("click", () => {
          const pid = parseInt(btn.dataset.id);
          const prod = products.find(p => p.id === pid);
          const newName = prompt("Edit name", prod.name); if(newName) prod.name = newName;
          const newPrice = prompt("Edit price", prod.price); if(newPrice) prod.price = parseFloat(newPrice);
          const newStock = prompt("Edit stock", prod.stock); if(newStock) prod.stock = parseInt(newStock);
          renderProdList(); renderCurrentPage();
        });
      });
      document.querySelectorAll(".deleteProdBtnAdmin").forEach(btn => {
        btn.addEventListener("click", () => {
          const pid = parseInt(btn.dataset.id);
          products = products.filter(p => p.id !== pid);
          renderProdList(); renderCurrentPage();
        });
      });
    }
    renderProdList();
    document.getElementById("addProductBtnAdmin").onclick = () => {
      const newId = Date.now();
      products.push({ id: newId, name: "NEW DROP", price: 69, category: "tee", sizes: ["S","M","L"], colors: ["Black"], stock: 15, image: "https://images.unsplash.com/photo-1556905055-8f358a7a47b2?w=600&auto=format", badge: "Just Dropped", rating: 5 });
      renderProdList(); renderCurrentPage(); showToast("Product added");
    };
    document.getElementById("updateHeroBtnAdmin").onclick = () => {
      const newHero = document.getElementById("heroInputAdmin").value;
      if(newHero) {
        const heroEl = document.querySelector(".hero-main-title");
        if(heroEl) heroEl.innerText = newHero;
        showToast("Hero text updated globally");
      }
    };
    const ordersMock = [{id:"#LIT-1001", status:"Pending", total:"$189"},{id:"#LIT-1002", status:"Shipped", total:"$79"}];
    document.getElementById("adminOrdersList").innerHTML = ordersMock.map(o => `<div style="background:#1a1a1f; margin-bottom:0.5rem; padding:0.7rem;">${o.id} • ${o.status} • ${o.total} <button style="float:right;">Mark Shipped</button></div>`).join("");
  }

  // ---------- PAGE RENDERING (Premium, no generic look) ----------
  function renderHome() {
    return `
      <section style="min-height: 90vh; display: flex; align-items: center; position: relative; background: radial-gradient(ellipse at 30% 40%, #111115, #030303);">
        <div style="max-width: 1400px; margin: 0 auto; padding: 4rem 6%; width: 100%;">
          <div style="max-width: 700px;">
            <h1 class="hero-main-title" style="font-size: 5rem; font-weight: 800; line-height: 1.1; letter-spacing: -3px;">Wear The Future.</h1>
            <p style="font-size: 1.2rem; color: #bbb; margin: 1.5rem 0 2rem;">Limited drops. Gaming aesthetics. Ultra-premium streetwear.</p>
            <div style="display: flex; gap: 1.2rem;">
              <button class="btn-primary shop-now-hero" style="padding: 1rem 2.5rem; border-radius: 60px; font-weight: 700;">Shop Now →</button>
              <button class="btn-outline" style="padding: 1rem 2rem; border-radius: 60px;">Explore Drops</button>
            </div>
          </div>
          <div class="countdown-box" style="display: inline-block; margin-top: 3rem; padding: 0.8rem 1.8rem;">
            <span>🔥 NEXT DROP: </span><span id="countdownTimer" style="font-weight: 700; color:#ff5e00;">23:59:59</span>
          </div>
        </div>
      </section>
      <div style="padding: 4rem 6%; background: #0a0a0c;">
        <div style="display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; margin-bottom: 2rem;"><h2 style="font-size: 2rem;
