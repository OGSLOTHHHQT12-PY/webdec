<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIT DRIP | Wear The Future</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.iconify.design/3/3.1.0/iconify.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        heading: ['Space Grotesk', 'sans-serif'],
                        body: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        dark: {
                            900: '#0a0a0a',
                            800: '#111111',
                            700: '#1a1a1a',
                            600: '#222222',
                            500: '#333333',
                        },
                        accent: {
                            orange: '#FF6B35',
                            red: '#FF2E63',
                            purple: '#8B5CF6',
                            glow: '#FF6B35',
                        }
                    },
                    animation: {
                        'float': 'float 6s ease-in-out infinite',
                        'glow-pulse': 'glow-pulse 2s ease-in-out infinite alternate',
                        'slide-up': 'slide-up 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                        'fade-in': 'fade-in 1s ease-out forwards',
                        'marquee': 'marquee 20s linear infinite',
                        'countdown': 'countdown 1s infinite',
                    },
                    keyframes: {
                        'float': {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-20px)' },
                        },
                        'glow-pulse': {
                            '0%': { boxShadow: '0 0 5px rgba(255, 107, 53, 0.2)' },
                            '100%': { boxShadow: '0 0 20px rgba(255, 107, 53, 0.6)' },
                        },
                        'slide-up': {
                            '0%': { opacity: '0', transform: 'translateY(30px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        'fade-in': {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        },
                        'marquee': {
                            '0%': { transform: 'translateX(0)' },
                            '100%': { transform: 'translateX(-50%)' },
                        },
                        'countdown': {
                            '0%, 100%': { opacity: '1' },
                            '50%': { opacity: '0.7' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0a0a0a;
            color: #ffffff;
            overflow-x: hidden;
        }
        
        h1, h2, h3, h4, h5, h6 {
            font-family: 'Space Grotesk', sans-serif;
        }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: #111111;
        }
        
        ::-webkit-scrollbar-thumb {
            background: #333333;
            border-radius: 4px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: #555555;
        }
        
        /* Glassmorphism */
        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .glass-dark {
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        /* Glow Effects */
        .glow-orange {
            box-shadow: 0 0 20px rgba(255, 107, 53, 0.3), 0 0 40px rgba(255, 107, 53, 0.1);
        }
        
        .glow-text {
            text-shadow: 0 0 20px rgba(255, 107, 53, 0.5);
        }
        
        /* Magnetic Button */
        .magnetic-btn {
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }
        
        .magnetic-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }
        
        .magnetic-btn:hover::before {
            width: 300px;
            height: 300px;
        }
        
        /* Page Transitions */
        .page {
            display: none;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.5s ease, transform 0.5s ease;
        }
        
        .page.active {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }
        
        /* Loading Screen */
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0a0a0a;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }
        
        .loading-screen.hidden {
            opacity: 0;
            visibility: hidden;
        }
        
        .loading-bar {
            width: 200px;
            height: 2px;
            background: #333333;
            border-radius: 1px;
            overflow: hidden;
        }
        
        .loading-progress {
            height: 100%;
            background: linear-gradient(to right, #FF6B35, #FF2E63, #8B5CF6);
            width: 0;
            animation: loading 1.5s ease-out forwards;
        }
        
        @keyframes loading {
            0% { width: 0; }
            100% { width: 100%; }
        }
        
        /* Product Card Hover */
        .product-card {
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        
        .product-card:hover {
            transform: translateY(-10px);
        }
        
        .product-card:hover .product-image {
            transform: scale(1.05);
        }
        
        .product-card .product-image {
            transition: transform 0.5s ease;
        }
        
        /* Quick View Overlay */
        .quick-view-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        .quick-view-overlay.active {
            display: flex;
            opacity: 1;
        }
        
        /* Cart Drawer */
        .cart-drawer {
            position: fixed;
            top: 0;
            right: -400px;
            width: 400px;
            height: 100%;
            background: #111111;
            z-index: 1001;
            transition: right 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: -10px 0 30px rgba(0, 0, 0, 0.5);
        }
        
        .cart-drawer.open {
            right: 0;
        }
        
        .cart-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            display: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        .cart-overlay.active {
            display: block;
            opacity: 1;
        }
        
        /* Admin Dashboard */
        .admin-login {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0a0a0a;
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: center;
        }
        
        .admin-login.active {
            display: flex;
        }
        
        .admin-dashboard {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0a0a0a;
            z-index: 2000;
            display: none;
            overflow-y: auto;
        }
        
        .admin-dashboard.active {
            display: block;
        }
        
        /* Toast Notification */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #1a1a1a;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 15px 20px;
            z-index: 1500;
            transform: translateX(150%);
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .toast.show {
            transform: translateX(0);
        }
        
        /* Parallax Effect */
        .parallax-section {
            background-attachment: fixed;
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
        }
        
        /* Countdown Timer */
        .countdown-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 80px;
            height: 80px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }
        
        /* Scroll Reveal */
        .reveal {
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.8s ease, transform 0.8s ease;
        }
        
        .reveal.revealed {
            opacity: 1;
            transform: translateY(0);
        }
        
        /* Mobile Menu */
        .mobile-menu {
            position: fixed;
            top: 0;
            left: -100%;
            width: 80%;
            max-width: 300px;
            height: 100%;
            background: #111111;
            z-index: 1002;
            transition: left 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            padding: 80px 30px 30px;
        }
        
        .mobile-menu.open {
            left: 0;
        }
        
        .mobile-menu-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1001;
            display: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        .mobile-menu-overlay.active {
            display: block;
            opacity: 1;
        }
        
        /* Bento Grid */
        .bento-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(2, 200px);
            gap: 20px;
        }
        
        .bento-item {
            border-radius: 20px;
            overflow: hidden;
            position: relative;
            cursor: pointer;
        }
        
        .bento-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }
        
        .bento-item:hover img {
            transform: scale(1.1);
        }
        
        .bento-item:nth-child(1) {
            grid-column: span 2;
            grid-row: span 2;
        }
        
        .bento-item:nth-child(4) {
            grid-column: span 2;
        }
        
        /* Responsive Adjustments */
        @media (max-width: 768px) {
            .bento-grid {
                grid-template-columns: repeat(2, 1fr);
                grid-template-rows: repeat(3, 150px);
            }
            
            .bento-item:nth-child(1) {
                grid-column: span 2;
                grid-row: span 1;
            }
            
            .bento-item:nth-child(4) {
                grid-column: span 1;
            }
            
            .cart-drawer {
                width: 100%;
                right: -100%;
            }
            
            .countdown-item {
                width: 60px;
                height: 60px;
            }
        }
        
        /* Admin Table */
        .admin-table {
            width: 100%;
            border-collapse: collapse;
        }
        
        .admin-table th,
        .admin-table td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .admin-table th {
            font-weight: 500;
            color: #9CA3AF;
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        
        .admin-table tr:hover {
            background: rgba(255, 255, 255, 0.02);
        }
        
        /* Admin Sidebar */
        .admin-sidebar {
            width: 250px;
            height: 100%;
            background: #111111;
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            position: fixed;
            left: 0;
            top: 0;
            padding: 20px 0;
            overflow-y: auto;
        }
        
        .admin-content {
            margin-left: 250px;
            padding: 20px;
            min-height: 100vh;
        }
        
        @media (max-width: 1024px) {
            .admin-sidebar {
                width: 60px;
            }
            
            .admin-content {
                margin-left: 60px;
            }
            
            .admin-sidebar .sidebar-text {
                display: none;
            }
            
            .admin-sidebar .sidebar-icon {
                margin: 0 auto;
            }
        }
        
        /* Product Gallery */
        .product-gallery {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .product-gallery-main {
            width: 100%;
            height: 500px;
            border-radius: 16px;
            overflow: hidden;
            position: relative;
        }
        
        .product-gallery-main img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }
        
        .product-gallery-thumbs {
            display: flex;
            gap: 10px;
        }
        
        .product-gallery-thumbs img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 8px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: border-color 0.3s ease;
        }
        
        .product-gallery-thumbs img.active,
        .product-gallery-thumbs img:hover {
            border-color: #FF6B35;
        }
        
        /* Zoom Effect */
        .zoom-container {
            position: relative;
            overflow: hidden;
        }
        
        .zoom-container:hover .zoom-image {
            transform: scale(1.5);
        }
        
        .zoom-image {
            transition: transform 0.5s ease;
        }
    </style>
</head>
